{% extends "base.html" %}
{% block content %}
<div class="page-head"><div><h2>Academic Catalog</h2><p>Departments, branches and course syllabus information.</p></div></div>
<div class="row g-3">
{% for c in courses %}
<div class="col-md-6 col-lg-4">
  <div class="section-card h-100">
    <span class="badge text-bg-primary">{{ c['code'] }}</span>
    <h5 class="mt-3">{{ c['title'] }}</h5>
    <p class="text-muted mb-2">{{ c['department'] }} · Semester {{ c['semester'] }}</p>
    <hr>
    <small>{{ c['syllabus'] }}</small>
  </div>
</div>
{% endfor %}
</div>
{% endblock %}
