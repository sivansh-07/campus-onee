{% extends "base.html" %}
{% block content %}
<div class="page-head"><div><h2>Labs & Facilities</h2><p>Centralized room, equipment and department information.</p></div></div>
<div class="row g-3">{% for l in labs %}
<div class="col-md-6"><div class="section-card">
<span class="badge text-bg-primary">{{ l['department'] }}</span><h5 class="mt-2">{{ l['name'] }}</h5>
<p class="mb-1"><b>Location:</b> {{ l['building'] }}, {{ l['room'] }}</p>
<p class="mb-0"><b>Equipment:</b> {{ l['equipment'] }}</p>
</div></div>
{% endfor %}</div>
{% endblock %}
